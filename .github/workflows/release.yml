name: Release

# Runs when changesets/action publishes a new version (it pushes a `vX.Y.Z` git
# tag). Creates a GitHub Release whose notes are that version's CHANGELOG.md
# section.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract this version's CHANGELOG.md section
        id: notes
        run: |
          version="$(node -p "require('./package.json').version")"
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v header="## $version" '
            $0 == header { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file "${{ steps.notes.outputs.file }}"
